async function syncRosterToSeats(){
  // find how many would change first, so the confirm message is informative
  let candidates = 0;
  let unmatched = 0;
  for(const floor of Object.keys(DATA.floors)){
    for(const s of seats[floor]){
      const emp = empByName(s.name);
      if(emp){
        const changed = (s.dept||'')!==(emp.dept||'') || (s.part||'')!==(emp.part||'') ||
                         (s.position||'')!==(emp.position||'') || (s.ext||'')!==(emp.ext||'');
        if(changed) candidates++;
      } else if(s.name){
        unmatched++;
      }
    }
  }
  if(candidates === 0){
    showToast('이미 모두 최신 명단과 일치해요');
    return;
  }
  const msg = `현재 불러와진 직원 명단 기준으로 ${candidates}개 좌석의 소속·파트·직급·내선번호를 업데이트합니다.\n` +
              (unmatched ? `(명단에 없는 ${unmatched}개 좌석은 그대로 유지돼요)\n` : '') +
              `계속할까요?`;

  openConfirmPopover(msg, async ()=>{
    let updated = 0;
    for(const floor of Object.keys(DATA.floors)){
      let changed = false;
      for(const s of seats[floor]){
        const emp = empByName(s.name);
        if(!emp) continue;
        const newDept = emp.dept || '', newPart = emp.part || '',
              newPosition = emp.position || '', newExt = emp.ext || '';
        if(s.dept!==newDept || s.part!==newPart || s.position!==newPosition || s.ext!==newExt){
          s.dept = newDept; s.part = newPart; s.position = newPosition; s.ext = newExt;
          changed = true;
          updated++;
        }
      }
      if(changed) await persistFloorSeats(floor);
    }
    renderAll();
    showToast(`${updated}개 좌석을 최신 명단으로 동기화했어요`);
  });
}

async function handleRosterUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = ''; // 같은 파일 다시 선택 가능하게 초기화

  if(typeof XLSX === 'undefined'){
    showToast('엑셀 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요');
    return;
  }

  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});

    // 헤더 행 찾기: '이름'이 포함된 행
    let headerRow = -1;
    for(let i=0; i<rows.length; i++){
      if(rows[i].some(c => String(c).trim()==='이름')){ headerRow = i; break; }
    }
    if(headerRow === -1){
      showToast('엑셀에서 "이름" 헤더를 찾을 수 없어요. 표준 양식을 사용해 주세요');
      return;
    }

    // 열 위치 파악
    const hdr = rows[headerRow].map(c=>String(c).trim());
    const colName = hdr.indexOf('이름');
    const colDept = hdr.findIndex(h=>h.includes('소속'));
    const colPart = hdr.indexOf('파트');
    const colPos  = hdr.indexOf('직급');
    const colExt  = hdr.findIndex(h=>h.includes('내선'));
    if(colName<0 || colExt<0){
      showToast('필수 열(이름, 내선번호)을 찾을 수 없어요');
      return;
    }

    const list = [];
    for(let i=headerRow+1; i<rows.length; i++){
      const row = rows[i];
      const name = String(row[colName]||'').trim();
      const ext = String(row[colExt]||'').trim();
      if(!name) continue; // 이름 없는 줄 건너뜀
      list.push({
        name,
        dept: colDept>=0 ? String(row[colDept]||'').trim() : '',
        part: colPart>=0 ? String(row[colPart]||'').trim() : '',
        position: colPos>=0 ? String(row[colPos]||'').trim() : '',
        ext
      });
    }

    if(list.length === 0){
      showToast('엑셀에서 직원 정보를 찾을 수 없어요');
      return;
    }

    openConfirmPopover(`엑셀에서 직원 ${list.length}명을 읽었어요.\n이 명단으로 기존 명단을 교체할까요?\n\n(교체 후 "명단 동기화"를 눌러야 좌석에도 반영돼요)`, async ()=>{
      try{
        await saveEmployees(list);
        DATA.employees = list;
        showToast(`명단 ${list.length}명을 저장했어요. 이제 "명단 동기화"를 눌러 주세요`);
      }catch(err){
        console.error('roster save failed', err);
        showToast('명단 저장 중 오류가 발생했어요. 다시 시도해 주세요');
      }
    });
  }catch(err){
    console.error('roster parse failed', err);
    showToast('엑셀을 읽는 중 오류가 발생했어요. 파일 형식을 확인해 주세요');
  }
}

// ── 방문자 통계 ──────────────────────────────────────────────
// 구글 시트 'visitStats' 키에 날짜별 방문 수를 저장. 하루 1인 1회(중복 제외).
const VISIT_KEY = 'visitStats';
let visitStats = { daily: {} };

function localDateStr(d){
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

async function loadVisitStats(){
  try{
    const res = await gsGet(VISIT_KEY);
    if(res && res.value) visitStats = JSON.parse(res.value);
  }catch(e){ /* 아직 없음 */ }
  if(!visitStats || !visitStats.daily) visitStats = { daily:{} };
}

// 페이지 열릴 때 호출. 이 기기가 오늘 아직 카운트 안 됐으면 오늘 방문 +1.
async function recordVisit(){
  const today = localDateStr();
  let last = null;
  try{ last = localStorage.getItem('kr_last_visit'); }catch(e){}
  if(last === today) return; // 오늘 이미 카운트됨
  try{
    const res = await gsGet(VISIT_KEY);
    let stats = { daily:{} };
    if(res && res.value){ try{ stats = JSON.parse(res.value); }catch(e){} }
    if(!stats.daily) stats.daily = {};
    stats.daily[today] = (stats.daily[today]||0) + 1;
    await gsSet(VISIT_KEY, JSON.stringify(stats));
    visitStats = stats;
    try{ localStorage.setItem('kr_last_visit', today); }catch(e){}
  }catch(e){ console.warn('방문 기록 실패', e); }
}

function computeVisitSummary(){
  const daily = (visitStats && visitStats.daily) ? visitStats.daily : {};
  const today = localDateStr();
  const now = new Date();
  const dow = (now.getDay()+6)%7; // 월=0 ... 일=6
  const monday = new Date(now); monday.setDate(now.getDate()-dow);
  const mondayStr = localDateStr(monday);
  let todayCount = daily[today]||0, weekCount = 0, totalCount = 0;
  for(const [date, cnt] of Object.entries(daily)){
    const n = Number(cnt)||0;
    totalCount += n;
    if(date >= mondayStr && date <= today) weekCount += n;
  }
  return { todayCount, weekCount, totalCount, mondayStr };
}

async function openVisitStatsPopover(anchorEl){
  await loadVisitStats(); // 최신 값으로 갱신

async function silentRefresh(){
  // Skip entirely while a popover is open, so we never clobber an in-progress edit.
  if(document.getElementById('overlayBg').classList.contains('show')) return;

  try{ await loadAllFloorMeta(); }catch(e){ /* keep using the last known meta */ }
  try{ await loadLockerPositions(); }catch(e){ /* keep current locker positions */ }
  try{ await loadLockerData(); }catch(e){ /* keep current locker data */ }

  let anyChanged = false;
  for(const floor of Object.keys(DATA.floors)){
    try{
      const fresh = await loadFloorChunked(floor);
      if(fresh !== null){
        const freshStr = JSON.stringify(fresh);
        const currentStr = JSON.stringify(seats[floor]);
        if(freshStr !== currentStr){
          seats[floor] = fresh;
          anyChanged = true;
        }
      }
    }catch(e){
      // quiet failure - this is a background refresh, not a user-initiated action
      console.warn('silent refresh failed for', floor, e);
    }
  }
  if(anyChanged) renderAll();
}

(async function init(){
  const loader = document.getElementById('initialLoader');
  const safetyTimer = setTimeout(()=>{
    if(loader && !loader.classList.contains('hide')){
      loader.classList.add('hide');
      showToast('불러오는 데 시간이 걸리고 있어요. 네트워크를 확인해 주세요');
    }
  }, 15000);

  updateAdminUI();
  try{
    await loadAllFloorMeta();
  }catch(e){
    console.error('loadAllFloorMeta failed', e);
  }
  await Promise.all([
    loadAssignments().catch(e=>{
      console.error('loadAssignments failed entirely', e);
      showToast('데이터를 불러오는 중 문제가 있었어요. 새로고침해 주세요');
    }),
    loadAllLegendOrders().catch(e=>{
      console.error('loadAllLegendOrders failed entirely', e);
    }),
    loadLegendCategoryOverrides().catch(e=>{
      console.error('loadLegendCategoryOverrides failed entirely', e);
    }),
    loadLockerPositions().catch(e=>{
      console.error('loadLockerPositions failed entirely', e);
    }),
    loadLockerData().catch(e=>{
      console.error('loadLockerData failed entirely', e);
    }),
    loadOverseasData().catch(e=>{
      console.error('loadOverseasData failed entirely', e);
    }),
    loadEmployees().then(emp=>{
      if(emp === null){
        showToast('직원 명단이 아직 업로드되지 않았어요. 관리자에게 문의해 주세요');
        DATA.employees = [];
      } else {
        DATA.employees = emp;
      }
    }).catch(e=>{
      console.error('loadEmployees failed entirely', e);
      showToast('직원 명단을 불러오는 중 문제가 있었어요');
      DATA.employees = [];
    })
  ]);
  renderAll(); // always render, even if the above had partial failures - never leave the screen blank
  clearTimeout(safetyTimer);
  if(loader) loader.classList.add('hide');
  recordVisit(); // 방문 기록 (하루 1인 1회, 화면 렌더링과 무관하게 백그라운드 실행)
  setInterval(silentRefresh, 60000); // check for updates from other users once a minute
})();
</script>
</body>
</html>
